version: '3.8'

services:
  durgam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durgam-national-matrix
    restart: always
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://durgam-cache:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - durgam-cache
    networks:
      - durgam-mesh-net

  durgam-cache:
    image: redis:7-alpine
    container_name: durgam-redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - durgam-mesh-net

  durgam-gateway:
    image: nginx:alpine
    container_name: durgam-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - durgam-api
    networks:
      - durgam-mesh-net

networks:
  durgam-mesh-net:
    driver: bridge

volumes:
  redis-data:
