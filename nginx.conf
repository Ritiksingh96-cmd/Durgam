events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/x-font-ttf font/opentype
        image/svg+xml image/x-icon;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream FastAPI backend
    upstream durgam_backend {
        server durgam-api:8000;
        keepalive 32;
    }

    # HTTP server (port 80)
    server {
        listen 80;
        server_name localhost durgam.gov.in www.durgam.gov.in;

        # ── Statutory Government Security Headers ──────────────────────────
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header X-XSS-Protection           "1; mode=block"                   always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), microphone=()"   always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.openstreetmap.org; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none';"
            always;

        # ── Static Asset Caching ────────────────────────────────────────────
        location ~* \.(css|js|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
            proxy_pass http://durgam_backend;
            proxy_cache_bypass $http_upgrade;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ── WebSocket Upgrade (Live Telemetry Feed) ─────────────────────────
        location /api/v1/ws/ {
            proxy_pass         http://durgam_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── REST API Proxy ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://durgam_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  30s;
            proxy_read_timeout     120s;
            proxy_send_timeout     120s;
            proxy_buffer_size      4k;
            proxy_buffers          8 4k;
        }

        # ── All HTML Pages & SPA Routing ────────────────────────────────────
        location / {
            proxy_pass         http://durgam_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (bypass proxy logging)
        location /health {
            proxy_pass http://durgam_backend/health;
            access_log off;
        }
    }
}
