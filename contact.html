<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DURGAM — Emergency Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>
    <header class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-shield"><i data-lucide="shield"></i></div>
            <div class="brand-text"><div class="brand-name">DURGAM<span></span></div></div>
        </a>
        <nav class="nav-links"></nav>
        <div class="nav-right"></div>
    </header>
    <main class="page-container">
        <div class="ui-card" style="max-width:680px; margin:0 auto;">
            <div class="eyebrow"><span></span>EMERGENCY ASSISTANCE</div>
            <h2 style="font-family:'Space Grotesk',sans-serif; font-size:24px; margin-bottom:12px;">Contact Nodal Cyber Help Desks</h2>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">
                <div style="background:#faf9f5; border:1px solid #deddd7; border-radius:14px; padding:18px;">
                    <strong>National Cybercrime Helpline</strong>
                    <div style="font-size:22px; font-weight:700; color:#5c8000; margin-top:4px;">1930 (Toll-Free 24/7)</div>
                </div>
                <div style="background:#faf9f5; border:1px solid #deddd7; border-radius:14px; padding:18px;">
                    <strong>Emergency Response Support System</strong>
                    <div style="font-size:22px; font-weight:700; color:#ff3d3d; margin-top:4px;">112</div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
